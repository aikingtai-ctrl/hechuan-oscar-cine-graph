let W,H,tx=0,ty=0,scale=0.55;
function resize(){W=cv.width=cv.clientWidth;H=cv.height=cv.clientHeight;}
window.addEventListener('resize',resize);resize();
const N=G.nodes,E=G.edges,byId={};N.forEach(n=>byId[n.id]=n);
E.forEach(e=>{e.s=byId[e.source];e.t=byId[e.target];});
N.forEach((n,i)=>{const a=i*2.399;const r=60+Math.sqrt(i)*28;n.x=Math.cos(a)*r;n.y=Math.sin(a)*r;n.vx=0;n.vy=0;

let focus='',query='',sel=null,hover=null,drag=null,panning=false,px,py,alpha=1;
const neigh={};E.forEach(e=>{(neigh[e.source]=neigh[e.source]||new Set()).add(e.target);(neigh[e.target]=neigh[e.target]||new Set()).add(e.source);});

  // films' dp/director
  [...s].forEach(id=>{const n=byId[id]; if(n.type==='film') (neigh[id]||[]).forEach(b=>{const t=byId[b].type; if(t==='dp'||t==='director') s.add(b);});}); return s;}
let fset=null;
function shown(n){ if(!vis[n.type]) return false; if(fset&&!fset.has(n.id)) return false; return true;}
function matches(n){ return query && (n.label.toLowerCase().includes(query)||(n.eng||[]).join(' ').toLowerCase().includes(query)||(n.dp||'').toLowerCase().includes(query)||(n.director||'').toLowerCase().includes(query)); }
function step(){
  if(alpha<0.004)return; alpha*=0.992;
  const act=N.filter(shown);
  // repulsion (grid-free O(n^2), ~430 nodes ok)
  for(let i=0;i<act.length;i++){const a=act[i];for(let j=i+1;j<act.length;j++){const b=act[j];let dx=a.x-b.x,dy=a.y-b.y,d2=dx*dx+dy*dy+0.01;if(d2>160000)continue;const f=600*(1+a.r*0.25)*(1+b.r*0.25)/d2;dx*=f;dy*=f;a.vx+=dx;a.vy+=dy;b.vx-=dx;b.vy-=dy;}}
  E.forEach(e=>{if(!shown(e.s)||!shown(e.t))return;let dx=e.t.x-e.s.x,dy=e.t.y-e.s.y;const d=Math.sqrt(dx*dx+dy*dy)+0.01;const L=e.rel==='包含模块'?420:e.rel==='时代分期'?520:e.rel==='知识点'?110:e.rel==='论文选题'?120:e.rel==='主归属'?150:e.rel==='次归属'?190:e.rel==='属于时代'?170:70;
    const k=0.02*(d-L)/d*e.w;dx*=k;dy*=k;e.s.vx+=dx;e.s.vy+=dy;e.t.vx-=dx;e.t.vy-=dy;});
  act.forEach(n=>{if(n.fixed||n===drag){n.vx=n.vy=0;return;}const g=n.type==='film'?0.0006:0.0002;n.vx-=n.x*g;n.vy-=n.y*g;n.vx*=0.55;n.vy*=0.55;const sp=Math.hypot(n.vx,n.vy);if(sp>12){n.vx*=12/sp;n.vy*=12/sp;}n.x+=n.vx*alpha;n.y+=n.vy*alpha;});
}
function draw(){
  ctx.clearRect(0,0,W,H);ctx.save();ctx.translate(W/2+tx,H/2+ty);ctx.scale(scale,scale);
  const hi=sel?new Set([sel.id,...(neigh[sel.id]||[])]):(hover?new Set([hover.id,...(neigh[hover.id]||[])]):null);
  E.forEach(e=>{if(!shown(e.s)||!shown(e.t))return;const on=hi&&(e.s===sel||e.t===sel||e.s===hover||e.t===hover);

    if(showLabel){ctx.globalAlpha=dim?0.2:1;ctx.fillStyle=n.type==='film'?'#cfe9d1':'#fff';const fs=(n.type==='module'?14:n.type==='root'?15:n.type==='era'?12:10)/Math.max(scale,0.9);ctx.font=(n.type==='module'||n.type==='root'?'600 ':'')+fs+'px "Microsoft YaHei"';ctx.fillText(n.label,n.x+n.r+3,n.y+4);}

function pick(mx,my){const x=(mx-W/2-tx)/scale,y=(my-H/2-ty)/scale;let best=null,bd=1e9;N.forEach(n=>{if(!shown(n))return;const d=(n.x-x)**2+(n.y-y)**2;const rr=(n.r+6/scale)**2;if(d<rr&&d<bd){bd=d;best=n;}});return best;}

const side=document.getElementById('side');

function select(n){sel=n;if(!n){return;}
  const rels=E.filter(e=>e.s===n||e.t===n).map(e=>({o:e.s===n?e.t:e.s,rel:e.rel}));
  const grp={};rels.forEach(x=>{(grp[x.rel]=grp[x.rel]||[]).push(x.o);});
  let h='<h2>'+esc(n.label)+'</h2><div class="tp">'+esc(G.legend[n.type])+(n.skill?' · <code>'+n.skill+'</code>':'')+'</div>';
  if(n.desc)h+='<p>'+esc(n.desc)+'</p>';
  if(n.type==='film'){h+='<p><span class="k">序号</span> '+n.n+' · <span class="k">获奖</span> '+n.year+' · '+esc(n.genre)+' · '+esc(n.medium)+' · '+'★'.repeat(n.pr)+'</p>';
    h+='<p><span class="k">摄影师</span> '+esc(n.dp)+'<br/><span class="k">导演</span> '+esc(n.director)+'</p>';
    h+='<div>'+n.tags.map(t=>'<span class="tag">'+esc(t)+'</span>').join('')+'</div>';
    h+='<div class="note">'+esc(n.note)+'</div>';
    if(n.fix)h+='<div class="warn">原表勘误：'+esc(n.fix)+'</div>';}
  const order=['包含模块','时代分期','知识点','论文选题','主归属','次归属','属于时代','证据影片','研究对象','摄影师','导演'];
  order.forEach(r=>{if(!grp[r])return;const arr=grp[r].slice().sort((a,b)=>(a.year||'')<(b.year||'')?-1:1);h+='<p><span class="k">'+r+'</span>（'+arr.length+'）</p><ul>'+arr.map(o=>'<li>'+lk(o.id)+(o.year?' <span class="k">'+o.year+'</span>':'')+'</li>').join('')+'</ul>';});
  side.innerHTML=h;side.scrollTop=0;side.querySelectorAll('a[data-id]').forEach(a=>a.onclick=()=>{const t=byId[a.dataset.id];select(t);tx=-t.x*scale;ty=-t.y*scale;});}
